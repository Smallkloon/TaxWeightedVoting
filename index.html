<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column; control strip, tally bar, then the map, like a results desk board. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --fg: #161a22; --muted: #5d6573; --rule: #d9dde4; --none: #e3e6eb;
  --d3: #1f5fa8; --d2: #5b8fd0; --d1: #a9c6ea;
  --r3: #b3262d; --r2: #dc6a6c; --r1: #f1b3b1;
  --i3: #6a4fb0; --i2: #9580cf; --i1: #cdc2ea;
  --hatch: #161a22;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141a; --panel: #191d25; --fg: #e9ecf1; --muted: #9aa3b2; --rule: #2c323d; --none: #262b35;
  --d3: #4f8fe0; --d2: #2f63a3; --d1: #23406a;
  --r3: #e2575c; --r2: #a83a3e; --r1: #6a2a2d;
  --i3: #9a83e0; --i2: #6d58aa; --i1: #43386a;
  --hatch: #e9ecf1; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11141a; --panel: #191d25; --fg: #e9ecf1; --muted: #9aa3b2; --rule: #2c323d; --none: #262b35;
  --d3: #4f8fe0; --d2: #2f63a3; --d1: #23406a;
  --r3: #e2575c; --r2: #a83a3e; --r1: #6a2a2d;
  --i3: #9a83e0; --i2: #6d58aa; --i1: #43386a;
  --hatch: #e9ecf1; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2rem; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
.controls { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 64px; flex: none; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 600 .95rem/1 var(--f-display); letter-spacing: .03em; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--rule); background: var(--panel); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg button:focus-visible { outline: 2px solid var(--d3); outline-offset: 2px; }
.def { font-size: .8rem; color: var(--muted); margin: 0 0 0 72px; min-height: 2.9em; }
@media (max-width: 520px) { .lab { width: 100%; } .def { margin-left: 0; min-height: 4.35em; } .sub { min-height: 4.35em; } }
.board { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.tally { display: grid; gap: 6px; }
.tally-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--f-display); }
.tally-head .n { font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tally-head .who { font-size: .9rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.tally-head .mid { font-size: .85rem; color: var(--muted); text-align: center; }
.dn { color: var(--d3); } .rn { color: var(--r3); } .in { color: var(--i3); }
.bar { position: relative; height: 18px; display: flex; border-radius: 3px; overflow: hidden; background: var(--none); }
.bar span { display: block; height: 100%; transition: width .4s ease; }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
.sub { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 2.9em; }
.mapbox { overflow-x: auto; }
svg.map { width: 100%; height: auto; display: block; min-width: 320px; }
svg.map path.st { stroke: var(--panel); stroke-width: .8; cursor: pointer; }
svg.map .mesh { fill: none; stroke: var(--panel); stroke-width: 1; pointer-events: none; }
svg.map .hl { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linejoin: round; pointer-events: none; }
svg.map .flip { fill: url(#hatch); pointer-events: none; }
svg.map .lbl { font: 600 11px var(--f-display); fill: var(--fg); pointer-events: none; text-anchor: middle; }
svg.map rect.seat { stroke: none; }
svg.map rect.seat.flipped { stroke: var(--hatch); stroke-width: 1.4; }
svg.map rect.tile { fill: var(--panel); fill-opacity: 0; stroke: var(--rule); stroke-width: .8; }
svg.map g.state { cursor: pointer; }
svg.map path.st, svg.map rect.seat, svg.map .dist { transition: fill .3s ease; }
svg.map.house { min-width: 620px; }
svg.map.house .lbl { font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .78rem; color: var(--muted); align-items: center; }
.sw { display: inline-flex; align-items: center; gap: 6px; }
.chips { display: inline-flex; }
.chips i { width: 14px; height: 12px; display: inline-block; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--fg); color: var(--bg); padding: 8px 10px; border-radius: 4px; font-size: .8rem; line-height: 1.35; max-width: 240px; font-variant-numeric: tabular-nums; }
.tip b { font-family: var(--f-display); font-size: .95rem; letter-spacing: .02em; }
.legend .flipkey[data-off="true"] { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .bar span, svg.map path.st, svg.map rect.seat, svg.map .dist { transition: none; } }
</style>

const TILE = {AK:[0,0],ME:[11,0],WI:[6,1],VT:[10,1],NH:[11,1],WA:[1,2],ID:[2,2],MT:[3,2],ND:[4,2],MN:[5,2],IL:[6,2],MI:[7,2],NY:[9,2],MA:[10,2],OR:[1,3],NV:[2,3],WY:[3,3],SD:[4,3],IA:[5,3],IN:[6,3],OH:[7,3],PA:[8,3],NJ:[9,3],CT:[10,3],RI:[11,3],CA:[1,4],UT:[2,4],CO:[3,4],NE:[4,4],MO:[5,4],KY:[6,4],WV:[7,4],VA:[8,4],MD:[9,4],DE:[10,4],AZ:[2,5],NM:[3,5],KS:[4,5],AR:[5,5],TN:[6,5],NC:[7,5],SC:[8,5],OK:[4,6],LA:[5,6],MS:[6,6],AL:[7,6],GA:[8,6],HI:[0,7],TX:[4,7],FL:[9,7]};
const VIEWBOX = "0 0 975 650";

const years = Object.keys(DATA.years).sort().reverse();   // most recent first
const state = { year: years[0], office: "P", rule: "actual" };
let view = null;      // the drawn map for the current year and office
let builtKey = "";

function shade(p, share) {
  const k = p === "D" ? "d" : p === "R" ? "r" : "i";
  if (share == null) return `var(--${k}3)`;
  const m = Math.abs(share - 0.5) * 200;
  return `var(--${k}${m >= 15 ? 3 : m >= 5 ? 2 : 1})`;
}
function fmtShare(s, p) {
  if (s == null) return "Uncontested by both parties";
  return `${p === "I" ? "Ind" : "Dem"} ${(s * 100).toFixed(1)}% / Rep ${(100 - s * 100).toFixed(1)}% (two-party)`;
}

/* ---------- controls: built once, then only updated ---------- */
function seg(el, items, onPick) {
  el.replaceChildren(...items.map(([v, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.v = v; b.id = el.id + "-" + v;
    b.onclick = () => onPick(v); return b;
  }));
}
function mark(el, cur, disabled = () => false) {
  for (const b of el.children) { b.setAttribute("aria-pressed", String(b.dataset.v === cur)); b.disabled = disabled(b.dataset.v); }
}
const yearSeg = document.getElementById("yearSeg"), officeSeg = document.getElementById("officeSeg"), ruleSeg = document.getElementById("ruleSeg");
seg(yearSeg, years.map(y => [y, y]), v => { state.year = v; render(); });
seg(officeSeg, Object.entries(OFFICES), v => { state.office = v; render(); });
seg(ruleSeg, DATA.rules.map(r => [r, RULES[r][0]]), v => { state.rule = v; render(); });
document.getElementById("ruleRow").hidden = DATA.rules.length < 2;

/* ---------- tally: fixed structure, values updated ---------- */
const tallyEl = document.getElementById("tally");
tallyEl.innerHTML = `
  <div class="tally-head">
    <div><div class="n dn"><span id="tD"></span><span class="in" id="tI" style="font-size:1.3rem"></span></div><div class="who dn">Democratic</div></div>
    <div class="mid"><span id="tLabel"></span><br><span id="tNeed"></span></div>
    <div style="text-align:right"><div class="n rn" id="tR"></div><div class="who rn">Republican</div></div>
  </div>
  <div class="bar" id="tBar" role="img">
    <span id="bD" style="background:var(--d3)"></span><span id="bI" style="background:var(--i3)"></span>
    <span style="flex:1"></span><span id="bR" style="background:var(--r3)"></span><i class="tick" id="bTick"></i>
  </div>
  <div class="sub" id="tSub"></div>`;
const $ = id => document.getElementById(id);
function tally(parts, total, need, label, sub) {
  const d = parts.D || 0, r = parts.R || 0, i = parts.I || 0, pct = n => (n / total * 100) + "%";
  $("tD").textContent = d; $("tI").textContent = i ? ` + ${i} Ind.` : ""; $("tR").textContent = r;
  $("tLabel").textContent = label; $("tNeed").textContent = `${need} to win`;
  $("bD").style.width = pct(d); $("bI").style.width = pct(i); $("bR").style.width = pct(r);
  $("bTick").style.left = `calc(${pct(need)} - 1px)`;
  $("tBar").setAttribute("aria-label", `Democratic ${d}, Independent ${i}, Republican ${r} of ${total}`);
  $("tSub").textContent = sub;
}

/* ---------- svg helpers and tooltip ---------- */
const svgNS = "http://www.w3.org/2000/svg";
function mk(tag, attrs, parent) { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const tip = document.getElementById("tip");
function bindTip(el, html) {
  const show = ev => { tip.innerHTML = html(); tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, ev.clientX + 12)) + "px";
    tip.style.top = Math.max(8, ev.clientY - h - 12) + "px"; };
  el.addEventListener("pointermove", show); el.addEventListener("pointerdown", show);
  el.addEventListener("pointerleave", () => { tip.hidden = true; });
}
document.addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });
function hover(el, hl, place) {
  el.addEventListener("pointerenter", () => { place(); hl.style.visibility = "visible"; });
  el.addEventListener("pointerleave", () => { hl.style.visibility = "hidden"; });
}
function newSvg(isHouse) {
  const svg = document.getElementById("map");
  svg.replaceChildren(); svg.setAttribute("viewBox", VIEWBOX); svg.classList.toggle("house", isHouse);
  const defs = mk("defs", {}, svg);
  const p = mk("pattern", { id: "hatch", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
  mk("rect", { width: 2, height: 6, fill: "var(--hatch)", "fill-opacity": .55 }, p);
  return { svg, defs };
}

/* ---------- President and Senate: geographic map ---------- */
function buildGeo(contests, isPres) {
  const { svg, defs } = newSvg(false);
  const hl = mk("path", { class: "hl", style: "visibility:hidden" });
  const byState = {}, dists = [];
  for (const c of contests) (c.id.includes("-") ? dists : (byState[c.id] ||= [])).push(c);
  const items = [];
  for (const k in NAMES) {
    const g = GEO[k]; if (!g) continue;
    const cs = byState[k] || [];
    const item = { k, cs, path: mk("path", { d: g.d, class: "st", fill: "var(--none)" }, svg) };
    if (cs.length === 2) {           // two Senate races in one state: diagonal split
      const pat = mk("pattern", { id: "split" + k, width: 10, height: 10, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
      item.halves = [mk("rect", { width: 5, height: 10 }, pat), mk("rect", { x: 5, width: 5, height: 10 }, pat)];
    }
    item.flip = mk("path", { d: g.d, class: "flip", style: "visibility:hidden" }, svg);
    bindTip(item.path, () => `<b>${NAMES[k]}</b>` + (cs.length ? cs.map(c => {
      const now = c[state.rule], f = now[1] !== c.actual[1];
      const lab = isPres ? `${c.ev} electoral votes: ${PARTY[now[1]]}` : `Class ${c.cls}${c.sp ? " special" : ""}: ${PARTY[now[1]]}`;
      return `<br>${lab}${f ? " (flips)" : ""}<br>${fmtShare(now[0], now[1])}`;
    }).join("") : "<br>No race"));
    hover(item.path, hl, () => hl.setAttribute("d", g.d));
    items.push(item);
  }
  mk("path", { d: GEO._mesh, class: "mesh" }, svg);
  const boxes = [];
  if (dists.length) {
    const spots = { "ME-01": [736, 616], "ME-02": [760, 616], "NE-01": [826, 616], "NE-02": [850, 616], "NE-03": [874, 616] };
    for (const k of ["ME", "NE"]) { const [x, y] = spots[k + "-01"]; mk("text", { x: x - 6, y: y + 14, class: "lbl", style: "text-anchor:end" }, svg).textContent = k; }
    for (const c of dists) {
      const [x, y] = spots[c.id];
      const r = mk("rect", { x, y, width: 20, height: 20, rx: 2, class: "seat dist", style: "cursor:pointer" }, svg);
      mk("text", { x: x + 10, y: y + 14, class: "lbl", "font-size": 9 }, svg).textContent = c.id.slice(3);
      bindTip(r, () => { const now = c[state.rule]; return `<b>${c.id}</b><br>1 electoral vote: ${PARTY[now[1]]}${now[1] !== c.actual[1] ? " (flips)" : ""}<br>${fmtShare(now[0], now[1])}`; });
      hover(r, hl, () => hl.setAttribute("d", `M${x - 1},${y - 1}h22v22h-22Z`));
      boxes.push({ c, r });
    }
  }
  svg.appendChild(hl);
  return { kind: "geo", items, boxes };
}
function updateGeo(v) {
  for (const it of v.items) {
    const now = it.cs.map(c => c[state.rule]);
    let fill = "var(--none)";
    if (now.length === 1) fill = shade(now[0][1], now[0][0]);
    if (now.length === 2) {
      it.halves[0].setAttribute("fill", shade(now[0][1], null)); it.halves[1].setAttribute("fill", shade(now[1][1], null));
      fill = now[0][1] === now[1][1] ? shade(now[0][1], null) : `url(#split${it.k})`;
    }
    it.path.setAttribute("fill", fill);
    it.flip.style.visibility = it.cs.some(c => c[state.rule][1] !== c.actual[1]) ? "visible" : "hidden";
  }
  for (const { c, r } of v.boxes) {
    const now = c[state.rule]; r.setAttribute("fill", shade(now[1], now[0]));
    r.classList.toggle("flipped", now[1] !== c.actual[1]);
  }
}

/* ---------- House: state tiles with one square per seat ---------- */
function buildHouse(contests) {
  const { svg } = newSvg(true);
  const T = 78, S = 9, by = {};
  const hl = mk("rect", { class: "hl", width: T - 4, height: T - 4, rx: 3, style: "visibility:hidden" });
  for (const c of contests) (by[c.id.slice(0, 2)] ||= []).push(c);
  const seats = [];
  const key = c => c.actual[0] ?? (c.actual[1] === "D" ? 1 : 0);
  for (const k in TILE) {
    const [cx, cy] = TILE[k], x0 = cx * T + 20, y0 = cy * T + 26;
    const cs = (by[k] || []).slice().sort((a, b) => key(b) - key(a));   // fixed order: actual Democratic share
    const g = mk("g", { class: "state" }, svg);
    mk("rect", { x: x0, y: y0, width: T - 4, height: T - 4, rx: 3, class: "tile" }, g);
    mk("text", { x: x0 + 4, y: y0 - 4, class: "lbl", style: "text-anchor:start" }, g).textContent = k;
    const n = cs.length, cols = Math.max(1, Math.ceil(Math.sqrt(n))), rows = Math.ceil(n / cols);
    const ox = x0 + (T - 4 - cols * S) / 2, oy = y0 + (T - 4 - rows * S) / 2;
    cs.forEach((c, i) => {
      const r = mk("rect", { x: ox + (i % cols) * S, y: oy + Math.floor(i / cols) * S, width: S - 1, height: S - 1, class: "seat" }, g);
      seats.push({ c, r });
    });
    // one tooltip and one highlight per state, so moving between seats does not flicker
    bindTip(g, () => {
      const t = { D: 0, R: 0, I: 0 }, f = [];
      for (const c of cs) { const w = c[state.rule][1]; t[w]++; if (w !== c.actual[1]) f.push(c.id.slice(3)); }
      return `<b>${NAMES[k]}</b><br>Democratic ${t.D}, Republican ${t.R}${t.I ? `, Independent ${t.I}` : ""}` +
        (state.rule !== "actual" ? `<br>Flipped: ${f.length ? f.map(d => "District " + +d).join(", ") : "none"}` : "");
    });
    hover(g, hl, () => { hl.setAttribute("x", x0); hl.setAttribute("y", y0); });
  }
  svg.appendChild(hl);
  return { kind: "house", seats };
}
function updateHouse(v) {
  for (const { c, r } of v.seats) {
    const now = c[state.rule]; r.setAttribute("fill", shade(now[1], now[0]));
    r.classList.toggle("flipped", now[1] !== c.actual[1]);
  }
}

/* ---------- legend: fixed items per office ---------- */
function legend() {
  const el = document.getElementById("legend");
  const ch = k => `<span class="chips"><i style="background:var(--${k}1)"></i><i style="background:var(--${k}2)"></i><i style="background:var(--${k}3)"></i></span>`;
  el.innerHTML = `<span class="sw">${ch("d")} Democratic</span><span class="sw">${ch("r")} Republican</span>${state.office === "S" ? `<span class="sw">${ch("i")} Independent</span>` : ""}
    <span class="sw">Margin: under 5, 5 to 15, over 15 points</span>
    ${state.office !== "H" ? `<span class="sw"><i style="width:14px;height:12px;display:inline-block;background:var(--none)"></i> No race</span>` : ""}
    <span class="sw flipkey" data-off="${state.rule === "actual"}"><svg width="14" height="12"><rect width="14" height="12" fill="var(--none)" stroke="var(--hatch)" stroke-width="2"/></svg> Flipped from actual</span>`;
}

/* ---------- totals ---------- */
function totals() {
  const Y = DATA.years[state.year], ru = state.rule;
  if (state.office === "P") {
    const C = Y.P.contests, ev = { D: 0, R: 0 }, act = { D: 0, R: 0 };
    for (const c of C) { ev[c[ru][1]] += c.ev; act[c.actual[1]] += c.ev; }
    const f = C.filter(c => c[ru][1] !== c.actual[1]).map(c => c.id);
    tally(ev, 538, 270, "Electoral votes", `Actual: Democratic ${act.D}, Republican ${act.R}. Flipped: ${f.length ? f.join(", ") : "none"}`);
  } else if (state.office === "S") {
    const C = Y.S.contests, won = { D: 0, R: 0, I: 0 }, chA = Y.S.chamber.actual;
    for (const c of C) won[c[ru][1]]++;
    const f = C.filter(c => c[ru][1] !== c.actual[1]).map(c => c.id);
    tally(Y.S.chamber[ru], 100, 51, "Senate seats after election",
      `Races this year: Democratic ${won.D}, ${won.I ? `Independent ${won.I}, ` : ""}Republican ${won.R}. Actual chamber: Democratic ${chA.D || 0}, Independent ${chA.I || 0}, Republican ${chA.R || 0}. Flipped: ${f.length ? f.join(", ") : "none"}`);
  } else {
    const C = Y.H.contests, seats = { D: 0, R: 0, I: 0 }, act = { D: 0, R: 0, I: 0 };
    for (const c of C) { seats[c[ru][1]]++; act[c.actual[1]]++; }
    const n = C.filter(c => c[ru][1] !== c.actual[1]).length;
    tally(seats, 435, 218, "House seats", `Actual: Democratic ${act.D}, Republican ${act.R}. Seats flipped: ${n}`);
  }
}

function render() {
  if (state.office === "P" && +state.year % 4 !== 0) state.office = "S";
  mark(yearSeg, state.year); mark(officeSeg, state.office, v => v === "P" && +state.year % 4 !== 0); mark(ruleSeg, state.rule);
  $("ruleDef").textContent = RULES[state.rule][1];
  const key = state.year + state.office;
  if (key !== builtKey) {
    const Y = DATA.years[state.year];
    view = state.office === "H" ? buildHouse(Y.H.contests) : buildGeo(Y[state.office].contests, state.office === "P");
    builtKey = key; tip.hidden = true;
  }
  view.kind === "house" ? updateHouse(view) : updateGeo(view);
  totals(); legend();
  $("map").setAttribute("aria-label", `${OFFICES[state.office]} ${state.year}, ${RULES[state.rule][0]}`);
}
render();
</script>

</body></html>
